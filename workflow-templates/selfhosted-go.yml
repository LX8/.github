# LX8 default Go CI — runs on the org's $0 self-hosted macOS runner, never on
# billable GitHub-hosted minutes. Attach a runner first:
#   scripts/bootstrap-runner.sh <this-repo>      (see LX8/.github → RUNNERS.md)
name: CI

on:
  push:
    branches: ["$default-branch"]
  pull_request:
    branches: ["$default-branch"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # $0 self-hosted macOS runner. Go is provided per-job by setup-go.
    # NOTE: for Linux-only cgo deps, prefer macOS-available libs (e.g. libpcap
    # ships with macOS) rather than `apt-get`, which does not exist here.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: gofmt (no unformatted files)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
