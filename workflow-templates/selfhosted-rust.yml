# LX8 default Rust CI — runs on the org's $0 self-hosted macOS runner, never on
# billable GitHub-hosted minutes. This is the org standard: private repos must
# NOT use `ubuntu-latest`/`macos-latest` (they cost paid minutes and get
# billing-blocked). Before this runs, attach a runner to the repo:
#   scripts/bootstrap-runner.sh <this-repo>      (see LX8/.github → RUNNERS.md)
# or use the org-level runner group (zero per-repo setup — RUNNERS.md).
name: CI

on:
  push:
    branches: ["$default-branch"]
  pull_request:
    branches: ["$default-branch"]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run on the same ref so the shared self-hosted runner
# isn't stacked with redundant jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # $0 self-hosted macOS runner. rustup/cargo are provided by the runner Mac.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
